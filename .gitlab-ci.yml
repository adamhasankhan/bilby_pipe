# This script is an edited version of the example found at
# https://git.ligo.org/lscsoft/example-ci-project/blob/python/.gitlab-ci.yml
# Each 0th-indendation level is a job that will be run within GitLab CI
# The only exception are a short list of reserved keywords
#
# https://docs.gitlab.com/ee/ci/yaml/#gitlab-ci-yml

# stages is a reserved keyword that defines job dependencies and
# parallelization. each stage runs in parallel but must complete
# before the next stage begins

stages:
  - initial
  - test
  - docs
  - deploy

cache:
  paths:
    - .pip37
    - .pip36

# ------------------- Initial stage -------------------------------------------

# Test containers scripts are up to date
containers:
  stage: initial
  image: containers.ligo.org/lscsoft/bilby_pipe/v3-bilby_pipe-python37
  script:
    - cd containers
    - python write_dockerfiles.py
    # Fail if differences exist. If this fails, you may need to run
    # write_dockerfiles.py and commit the changes.
    - git diff --exit-code

precommits-py3.7:
  stage: initial
  image: containers.ligo.org/lscsoft/bilby_pipe/v3-bilby_pipe-python37
  script:
    - source activate python37
    - mkdir -p .pip37
    - pip install --upgrade pip
    - pip --cache-dir=.pip37 install --upgrade bilby
    - pip --cache-dir=.pip37 install .
    - pip --cache-dir=.pip37 install pre-commit

    # Run precommits (black, flake8, spellcheck, isort, no merge conflicts, etc)
    - pre-commit run --all-files --verbose --show-diff-on-failure

precommits-py3.8:
  stage: initial
  image: containers.ligo.org/lscsoft/bilby_pipe/v3-bilby_pipe-python38
  script:
    - source activate python38
    - mkdir -p .pip38
    - pip install --upgrade pip
    - pip --cache-dir=.pip38 install --upgrade bilby
    - pip --cache-dir=.pip38 install .
    - pip --cache-dir=.pip38 install pre-commit

    # Run precommits (black, flake8, spellcheck, isort, no merge conflicts, etc)
    - pre-commit run --all-files --verbose --show-diff-on-failure

precommits-py3.9:
  stage: initial
  image: containers.ligo.org/lscsoft/bilby_pipe/v3-bilby_pipe-python39
  script:
    - source activate python39
    - mkdir -p .pip39
    - pip install --upgrade pip
    - pip --cache-dir=.pip39 install --upgrade bilby
    - pip --cache-dir=.pip39 install .
    - pip --cache-dir=.pip39 install pre-commit

    # Run precommits (black, flake8, spellcheck, isort, no merge conflicts, etc)
    - pre-commit run --all-files --verbose --show-diff-on-failure

# ------------------- Test stage -------------------------------------------

python-3.7:
  stage: test
  image: containers.ligo.org/lscsoft/bilby_pipe/v3-bilby_pipe-python37
  script:
    - source activate python37
    - mkdir -p .pip37
    - pip install --upgrade pip
    - pip --cache-dir=.pip37 install --upgrade bilby
    - pip --cache-dir=.pip37 install .
    - test -z ${CONDA_PREFIX} && pip list installed || conda list

    # Run tests and collect coverage data
    - pytest --cov bilby_pipe
    - coverage html
    - coverage-badge -o coverage_badge.svg -f
  artifacts:
    paths:
      - htmlcov/
      - coverage_badge.svg

python-3.8:
  stage: test
  image: containers.ligo.org/lscsoft/bilby_pipe/v3-bilby_pipe-python38
  script:
    - source activate python38
    - mkdir -p .pip38
    - pip install --upgrade pip
    - pip --cache-dir=.pip38 install --upgrade bilby
    - pip --cache-dir=.pip38 install .
    - test -z ${CONDA_PREFIX} && pip list installed || conda list

    # Run tests
    - pytest

python-3.9:
  stage: test
  image: containers.ligo.org/lscsoft/bilby_pipe/v3-bilby_pipe-python39
  script:
    - source activate python39
    - mkdir -p .pip39
    - pip install --upgrade pip
    - pip --cache-dir=.pip39 install --upgrade bilby
    - pip --cache-dir=.pip39 install .
    - test -z ${CONDA_PREFIX} && pip list installed || conda list

    # Run tests
    - pytest

# Test that the examples build properly
example-ini-file-builds:
  stage: test
  image: containers.ligo.org/lscsoft/bilby_pipe/v3-bilby_pipe-python37
  script:
    - source activate python37
    - mkdir -p .pip37
    - pip --cache-dir=.pip37 install --upgrade bilby
    - pip --cache-dir=.pip37 install .
    - cd examples/event
    - bilby_pipe GW150914.ini
    - cd outdir_GW150914/
    - bilby_pipe GW150914_config_complete.ini --overwrite-outdir # Check that the completed config file compiles
    - cd ../../gaussian_noise
    - bilby_pipe *ini
    - cd ../injection
    - bilby_pipe *ini
    - cd ../gps_times
    - bilby_pipe gps_times_from_file.ini
    - bilby_pipe gps_times_from_tuple.ini
    - cd ../slurm
    - bilby_pipe slurm_GW150914.ini

# Test that the examples build properly
injection-regression-test:
  stage: test
  image: containers.ligo.org/lscsoft/bilby_pipe/v3-bilby_pipe-python37
  script:
    - source activate python37
    - mkdir -p .pip37
    - pip --cache-dir=.pip37 install --upgrade bilby
    - pip --cache-dir=.pip37 install .
    - cd tests_ini_files/
    - bilby_pipe test_gaussian_noise_simulation_and_injection.ini --local --bilby-test-mode
    - bilby_pipe test_gaussian_noise_simulation.ini --local --bilby-test-mode

    - bilby_pipe_create_injection_file --prior-file ../tests/injection_prior.prior -n 1 -f injection_test.dat
    - if [[ ! -f injection_test.dat ]] ; then exit 1; else echo "Injection file exists"; fi

# Test that the review tests build properly
review-test-build:
  stage: test
  image: containers.ligo.org/lscsoft/bilby_pipe/v3-bilby_pipe-python37
  script:
    - source activate python37
    - mkdir -p .pip37
    - pip --cache-dir=.pip37 install --upgrade bilby
    - pip --cache-dir=.pip37 install .
    - mkdir TEST_REVIEW_FILES
    - cd TEST_REVIEW_FILES

    - bilby_pipe_review --prior 4s --bbh --marginalization distance phase --nact 5 --directory TEST
    - if [[ ! -f TEST/review_fiducial_bbh_4s_dynesty_distance-phase_nact5.ini ]] ; then exit 1; else echo "Webpage exists"; fi

    - bilby_pipe_review --prior 4s --pp-test --marginalization distance phase --sampler cPnEst --nact 5 --directory TEST
    - if [[ ! -f TEST/review_pp_test_4s_cpnest_distance-phase_nact5.ini ]] ; then exit 1; else echo "Webpage exists"; fi
    - cd ..
    - rm TEST_REVIEW_FILES -r

example-ini-file-pesummary:
  stage: test
  image: containers.ligo.org/lscsoft/bilby_pipe/v3-bilby_pipe-python37
  script:
    - source activate python37
    - pip install --upgrade bilby pesummary seaborn>=0.11
    - pip install .
    - cd tests/
    - bilby_pipe test_pesummary.ini --local --bilby-test-mode
    - exit

example-ini-file-gracedb:
  stage: test
  image: containers.ligo.org/lscsoft/bilby_pipe/v3-bilby_pipe-python37
  only:
    - schedules
  script:
    - source activate python37
    - pip install --upgrade bilby pesummary
    - pip install .
    - bilby_pipe_gracedb --json examples/gracedb/G298936.json --local --bilby-test-mode --output full-submit --sampler-kwargs FastTest --n-parallel 1
    - if [[ ! -f outdir_G298936/results_page/home.html ]] ; then exit 1; else echo "Webpage exists"; fi


# ------------------- Docs stage -------------------------------------------

docs:
  stage: docs
  image: containers.ligo.org/lscsoft/bilby_pipe/v3-bilby_pipe-python37
  script:
    - source activate python37
    - mkdir -p .pip37
    - pip --cache-dir=.pip37 install .

    # Make the documentation
    - apt-get update --allow-releaseinfo-change
    - apt-get -y install graphviz
    # Sphinx-multiversion needs to be run on the git repo itself
    - cd ../
    - rm bilby_pipe/ -r
    - git clone https://git.ligo.org/lscsoft/bilby_pipe.git
    - cd bilby_pipe/
    # Installation and clean up
    - cd docs
    - pip install -r requirements.txt
    - make clean
    - bilby_pipe_write_default_ini default.ini
    - bilby_pipe_gracedb --json ../examples/gracedb/G298936.json --output ini --outdir .
    # Sphinx-multiversion needs to be run from the top-level
    - cd ..
    - git fetch origin master
    - git status
    - git branch
    - sphinx-multiversion docs/ docs/_build/

  artifacts:
    paths:
      - docs/_build/

# ------------------- Deploy stage -------------------------------------------

pages:
  stage: deploy
  needs: ["docs", "python-3.7"]
  dependencies:
    - python-3.7
    - docs
  script:
    - mkdir public/
    - mv htmlcov/ public/
    - mv /builds/lscsoft/bilby_pipe/coverage_badge.svg public/
    - mv docs/_build/* public/
  artifacts:
    paths:
      - public
    expire_in: 30 days
  only:
  - master


# Build the containers
build-python37-container:
  stage: deploy
  image: docker:19.03.12
  needs: ["containers"]
  only:
    - schedules
  script:
    - cd containers
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build --tag v3-bilby_pipe-python37 - < v3-dockerfile-test-suite-python37
    - docker image tag v3-bilby_pipe-python37 containers.ligo.org/lscsoft/bilby_pipe/v3-bilby_pipe-python37:latest
    - docker image push containers.ligo.org/lscsoft/bilby_pipe/v3-bilby_pipe-python37:latest

build-python38-container:
  stage: deploy
  image: docker:19.03.12
  needs: ["containers"]
  only:
    - schedules
  script:
    - cd containers
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build --tag v3-bilby_pipe-python38 - < v3-dockerfile-test-suite-python38
    - docker image tag v3-bilby_pipe-python38 containers.ligo.org/lscsoft/bilby_pipe/v3-bilby_pipe-python38:latest
    - docker image push containers.ligo.org/lscsoft/bilby_pipe/v3-bilby_pipe-python38:latest

build-python39-container:
  stage: deploy
  image: docker:19.03.12
  needs: ["containers"]
  only:
    - schedules
  script:
    - cd containers
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build --tag v3-bilby_pipe-python39 - < v3-dockerfile-test-suite-python39
    - docker image tag v3-bilby_pipe-python39 containers.ligo.org/lscsoft/bilby_pipe/v3-bilby_pipe-python39:latest
    - docker image push containers.ligo.org/lscsoft/bilby_pipe/v3-bilby_pipe-python39:latest


deploy_release:
  stage: deploy
  image: containers.ligo.org/lscsoft/bilby_pipe/v3-bilby_pipe-python37
  variables:
    TWINE_USERNAME: $PYPI_USERNAME
    TWINE_PASSWORD: $PYPI_PASSWORD
  before_script:
    - pip install twine
    - python setup.py sdist
  script:
    - twine upload dist/*
  only:
  - tags
